<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dsSelect - Demo Básica</title>

    <link rel="stylesheet" href="dsSelect.css" />

    <style>
        body {
            background: radial-gradient(circle at top, #1f2933, #020617);
            color: #e5e7eb;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        div.demo-container {
            max-width: 640px;
            width: 100%;
            background-color: rgba(15, 23, 42, 0.96);
            border-radius: 18px;
            padding: 24px 28px 32px;
            box-shadow:
                0 24px 80px rgba(0, 0, 0, 0.85),
                0 0 0 1px rgba(15, 23, 42, 0.9);
        }

        div.demo-container > h1 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 1.4rem;
            color: #f9fafb;
        }

        div.demo-container > p {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 0.9rem;
            color: #cbd5f5;
        }

        div.field-group {
            margin-bottom: 22px;
        }

        label.demo-label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #e5e7eb;
        }

        small.demo-hint {
            display: block;
            margin-top: 6px;
            font-size: 0.78rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <h1>dsSelect - Demo Básica</h1>
        <p>
            Este exemplo mostra o componente dsSelect usando apenas o dsSelect.css.
            Para personalizar o visual, edite as variáveis no topo do arquivo
            <code>dsSelect.css</code>.
        </p>

        <div class="field-group">
            <label class="demo-label" for="regiao-select">
                Selecione uma região:
            </label>

            <select
                name="regiao"
                id="regiao-select"
                class="dsSelect"
                data-ds-placeholder="Escolha uma região"
            >
                <option value="">Selecione...</option>
                <option value="NE">Nordeste</option>
                <option value="SE" selected>Sudeste</option>
                <option value="SUL">Sul</option>
                <option value="CO">Centro-Oeste</option>
                <option value="N">Norte</option>
            </select>

            <small class="demo-hint">
                Este <code>&lt;select&gt;</code> não possui CSS próprio.
                Todo o visual que você está vendo vem do <strong>dsSelect.css</strong>.
            </small>
        </div>
    </div>

    <script src="dsSelect.js"></script>
    <script>
        window.addEventListener('load', function () {
            dsSelect({
                selector: '#regiao-select',
                placeholder: 'Selecione a região',
                searchable: true
            });
        });
    </script>
</body>
</html>
