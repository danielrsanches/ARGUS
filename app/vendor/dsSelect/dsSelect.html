<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>dsSelect - Demo Básica</title>

        <link rel="stylesheet" href="dsSelect.css" />

        <style>
            body {
                background: radial-gradient(circle at top, #1f2933, #020617);
                color: #e5e7eb;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                margin: 0;
                padding: 40px 20px;
                display: flex;
                justify-content: center;
            }
        </style>
    </head>
    <body>
        <div class="demo-container">
            <h1>dsSelect - Demo Básica</h1>
            <p>
                Este exemplo mostra o componente dsSelect usando apenas o dsSelect.css. Para personalizar o visual, edite as variáveis no topo do arquivo
                <code>dsSelect.css</code>.
            </p>

            <div class="field-group">
                <label class="demo-label" for="regiao-select"> Selecione uma região: </label>

                <p>
                    <select name="regiao" id="regiao">
                        <option value="NE">Nordeste</option>
                        <option value="SE" selected>Sudeste</option>
                        <option value="SUL">Sul</option>
                        <option value="CO">Centro-Oeste</option>
                        <option value="N">Norte</option>
                    </select>
                </p>

                <p>
                    <small class="demo-hint"> Este <code>&lt;select&gt;</code> não possui CSS próprio. Todo o visual que você está vendo vem do <strong>dsSelect.css</strong>. </small>
                </p>
            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="dsSelect.js"></script>
        <script>
            dsSelect({
                selector: "#regiao",
                placeholder: "Selecione a região",
                searchable: true,
            });
        </script>
    </body>
</html>
