<!-- ===== MODAL SECUNDÁRIO DE DOCUMENTOS ===== -->
<div class="modalBackdrop secundario" id="documentosModal">
    <div class="modal">
        <div class="modalTitulo">
            <div class="texto">Gerenciar Documentos</div>
            <button class="fechar-secundario">X</button>
        </div>
        <div class="modalContent">
            <fieldset class="documentos-fieldset">
                <legend>Adicionar Novo Documento</legend>
                <div class="linha">
                    <div class="campo">
                        <label for="doc_tipo">Tipo</label>
                        <select name="doc_tipo" id="doc_tipo">
                            <option value="cpf">CPF</option>
                            <option value="rgSp">RG/SP</option>
                            <option value="rgCriminal">RG Criminal</option>
                            <option value="rgOutroEstado">RG (outro Estado)</option>
                            <option value="matricula">Matrícula</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="doc_valor">Número</label>
                        <input type="text" id="doc_valor" name="doc_valor" maxlength="50" />
                    </div>
                    <div class="campo">
                        <label for="doc_observacao">Observação</label>
                        <input type="text" id="doc_observacao" name="doc_observacao" maxlength="255" />
                    </div>
                    <div class="campo">
                        <button type="button" class="adicionar-documento">Adicionar</button>
                    </div>
                </div>
            </fieldset>
            
            <div class="documentos-container-gerenciamento">
                <!-- Documentos adicionados para gerenciamento aparecerão aqui -->
            </div>
        </div>
        <div class="modalRodape">
            <button class="concluir-documentos primario">Concluir</button>
        </div>
    </div>
</div>
