<section id="fotocrim" class="modulo fotocrim">
    <div class="topBar">
        <div class="titulo">
            <strong>Fotocrim</strong>
            <div class="menuModulo">
                <select name="relatorios" id="relatorios" class="relatorios">
                    <option value="">Relatórios...</option>
                    <option value="dossie">Dossiê</option>
                </select>
                <button class="novo">Novo registro</button>
                <button class="pesquisa">Pesquisar</button>
                <button class="filtrarSelecionados">Filtrar selecionados</button>
                <button class="filtrarSelecionados">Inverter seleção</button>
            </div>
        </div>
    </div>

    <div class="content">

    </div>
</section>


<section class="card" data-id="${id}">
    <div class="topBar">
        <div class="left">
            <span class="campo" data-field="id">#${id}</span>
            <span class="campo" data-field="createdAt">Criado: ${createdAt}</span>
            <span class="campo" data-field="updatedAt">Modificado: ${updatedAt}</span>
        </div>
    </div>
    <div class="body">
        <div class="foto" aria-hidden="true">
            <img src="" alt="Foto" />
        </div>
        <div class="col1">
            <div class="campo" data-field="nomeCompleto">${nomeCompleto}</div>
            <div class="campo" data-field="faccao"><strong>Facção:</strong> ${faccao}</div>
            <div class="campo" data-field="cpf"><strong>CPF:</strong> ${cpf}</div>
            <div class="campo" data-field="rg"><strong>RG:</strong> ${rg}</div>
            <div class="campo" data-field="rgc"><strong>RG Criminal:</strong> ${rgc}</div>
            <div class="campo" data-field="matricula"><strong>Matrícula:</strong> ${matricula}</div>
            <div class="campo" data-field="dataNascimento"><strong>Nascimento:</strong> ${dataNascimento}</div>
        </div>
    </div>
    <div class="footer">
    </div>
</section>
